<section id="instagram" class="ig">
  <div class="container">
    <div class="ig__header">
      <div class="ig__head-left">
        <span class="ig__eyebrow">&#64;prodom.nalchik</span>
        <h2 class="ig__title">
          Следите за<br>
          <span class="ig__title-accent">новинками в Instagram</span>
        </h2>
      </div>
      <a class="btn btn--dark ig__follow" [href]="profileUrl" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="17.4" cy="6.6" r="1.2" fill="currentColor"/>
        </svg>
        Подписаться
      </a>
    </div>

    <div class="ig__grid">
      @for (post of posts(); track post.id) {
        <a class="ig__item" [href]="profileUrl" target="_blank" rel="noopener" [attr.aria-label]="post.caption">
          <img [src]="post.imageUrl" [alt]="post.caption" loading="lazy">
          <span class="ig__overlay">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="17.4" cy="6.6" r="1.2" fill="currentColor"/>
            </svg>
            <span class="ig__caption">{{ post.caption }}</span>
          </span>
        </a>
      }
    </div>
  </div>
</section>
